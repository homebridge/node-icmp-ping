name: Publish GitHub Release to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'homebridge/node-icmp-ping' && github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - id: release
        run: node scripts/release-check.js
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: validate
    uses: ./.github/workflows/native.yml
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-production-publication
      cancel-in-progress: false
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Recheck release identity and metadata before publication
        run: node scripts/release-check.js
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v8
        with:
          name: npm-distribution
          path: distribution
      - name: Verify retained bundled tarball and publish one package
        env:
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: node scripts/publish.js
