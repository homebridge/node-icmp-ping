name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  loader-check:
    name: Check PR loader version
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.validate.outputs.changed || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - id: detect
        if: github.event_name == 'pull_request'
        run: node scripts/pr-loader.js detect
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.changed == 'true'
      - name: Regenerate once using the pinned CLI and locked Cargo dependencies
        if: steps.detect.outputs.changed == 'true'
        run: |
          npm ci
          npm run build
      - id: validate
        if: steps.detect.outputs.changed == 'true'
        run: node scripts/pr-loader.js validate
      - uses: actions/upload-artifact@v7
        if: steps.validate.outputs.changed == 'true'
        with:
          name: pr-version-loader
          path: binding.js
          if-no-files-found: error
  update-pr-loader:
    needs: loader-check
    if: >-
      github.event_name == 'pull_request' &&
      needs.loader-check.outputs.changed == 'true' &&
      github.repository == 'homebridge/node-icmp-ping' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      # Execute only reviewed base code. No npm/build/PR code in this job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v8
        with:
          name: pr-version-loader
          path: regenerated-loader
      - name: Independently validate, commit only binding.js and restart CI
        run: node scripts/commit-pr-loader.js
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: loader-check
    if: needs.loader-check.outputs.changed == 'false'
    uses: ./.github/workflows/native.yml
