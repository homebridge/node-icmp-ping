name: Native build and test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: node scripts/check-versions.js
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
  prebuild:
    needs: checks
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, arch: x64 }
          - { runner: macos-15, target: aarch64-apple-darwin, arch: arm64 }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, arch: x64 }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Record actual Node and Rust versions and architecture
        run: |
          node -p "JSON.stringify({node:process.version,napi:process.versions.napi,arch:process.arch,platform:process.platform})"
          rustc --version --verbose
          cargo --version
      - run: npm ci
      - run: npm run build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            icmp_ping.*.node
            binding.js
          if-no-files-found: error
  prebuild-musl:
    needs: checks
    name: ${{ matrix.target }} (native Alpine)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, arch: x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Actions run on glibc; the native build runs inside musl.
      - name: Build native Alpine toolchain image
        run: docker build --pull -f .github/musl.Dockerfile -t icmp-musl .
      - name: Build on native musl
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" \
            -e TARGET -e EXPECTED_ARCH -e EXPECTED_LIBC=musl -e EXPECTED_NODE=26 \
            icmp-musl sh -ec '
              node scripts/check-runtime.js
              rustc --version --verbose
              test "$(rustc -vV | sed -n "s/^host: //p")" = "$TARGET"
              cargo --version
              npm ci
              npm run build -- --target "$TARGET"
            '
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            icmp_ping.*.node
            binding.js
          if-no-files-found: error

  package:
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: artifacts
      - run: node scripts/assemble.js
      - run: npm run test:release
      - uses: actions/upload-artifact@v7
        with:
          name: npm-distribution
          path: distribution/
          if-no-files-found: error

  install:
    name: Smoke (${{ matrix.runner }}, Node 26)
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: macos-15, arch: arm64 }
          - { runner: windows-2025, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v8
        with:
          name: npm-distribution
          path: distribution
      - name: Install assembled package and exercise CJS, ESM and ICMP
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_NODE: 26
          EXPECTED_LIBC: ${{ runner.os == 'Linux' && 'gnu' || '' }}
        run: node scripts/test-install.js

  install-musl:
    name: Smoke (Alpine x64, Node 26)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-distribution
          path: distribution
      - name: Install assembled package and exercise CJS, ESM and ICMP on musl
        run: |
          docker run --rm --cap-add=NET_RAW -v "$PWD:/work:ro" -w /work \
            -e EXPECTED_ARCH=x64 -e EXPECTED_NODE=26 -e EXPECTED_LIBC=musl \
            node:26-alpine3.23 node scripts/test-install.js
