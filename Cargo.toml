[package]
name = "node-icmp-ping"
version = "1.0.1"
edition = "2021"
license = "MIT"
description = "Bounded ICMP Echo for Node.js"
repository = "https://github.com/homebridge/node-icmp-ping"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
socket2 = { version = "0.6", features = ["all"] }
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
